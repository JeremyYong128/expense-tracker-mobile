name: expense_tracker_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  ios: true
  image_path: "assets/app_icon.jpg"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/app_icon.jpg"
  ios: true
